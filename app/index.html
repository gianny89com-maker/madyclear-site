<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071521">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="referrer" content="same-origin">
  <title>MADYCLEAR Personal — Accès privé</title>
  <meta name="description" content="Accès privé au cockpit MADYCLEAR Personal.">
  <link rel="icon" href="../assets/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="../assets/favicon.png">
  <link rel="manifest" href="manifest.webmanifest?v=private-20260917">
  <!-- Marqueur de compatibilité avec l’ancien service worker : src="./sync.js -->
  <style>
    :root{color-scheme:dark;--bg:#06111a;--panel:#0a1d29;--line:#20404e;--text:#eff9fb;--muted:#9fb2bc;--teal:#17a89f;--teal2:#0d776f;--danger:#ef6671;--ok:#36c6a8}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -10%,#123e4d 0,#071822 35%,var(--bg) 75%);color:var(--text)}
    body{min-height:100vh;display:grid;place-items:center;padding:22px}
    .shell{width:min(460px,100%)}.brand{display:flex;justify-content:center;margin-bottom:20px}.brand img{width:210px;max-width:70vw;filter:drop-shadow(0 12px 24px #0007)}
    .card{background:linear-gradient(180deg,#0d2532ee,#081923f5);border:1px solid var(--line);border-radius:28px;padding:24px;box-shadow:0 28px 90px #0009;backdrop-filter:blur(16px)}
    .eyebrow{font-size:12px;letter-spacing:.16em;font-weight:900;color:#68d4cc;text-transform:uppercase}.lock{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:16px;background:#113b42;margin-bottom:14px;font-size:23px}
    h1{font-size:29px;line-height:1.05;margin:6px 0 10px}p{color:var(--muted);line-height:1.55;margin:0 0 18px}.status{padding:11px 13px;border:1px solid var(--line);border-radius:14px;background:#071721;color:#b9cbd2;font-size:13px;margin:14px 0}.status.ok{border-color:#245e58;color:#9ef1df}.status.err{border-color:#663843;color:#ffacb5}
    form{display:grid;gap:11px}.field label{display:block;font-size:12px;font-weight:800;margin:0 0 6px;color:#cfe1e6}.field input{width:100%;border:1px solid #2b4d5b;background:#061620;color:#fff;border-radius:14px;padding:13px 14px;font:inherit;outline:none}.field input:focus{border-color:#42bdb4;box-shadow:0 0 0 3px #1ba79d25}
    button,a.btn{border:0;border-radius:14px;padding:13px 15px;font-weight:900;font:inherit;cursor:pointer;text-decoration:none;text-align:center;display:block}.primary{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff}.secondary{background:#15313d;color:#e7f7f8;border:1px solid #294b58!important}.link{display:block;text-align:center;margin-top:16px;color:#7cd9d2;text-decoration:none;font-weight:800;font-size:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.legal{font-size:11px;color:#7f98a2;margin-top:18px;text-align:center;line-height:1.5}.hidden{display:none!important}.spinner{width:26px;height:26px;border:3px solid #ffffff35;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:430px){body{padding:14px}.card{padding:20px;border-radius:22px}.row{grid-template-columns:1fr}h1{font-size:26px}}
  </style>
</head>
<body>
  <div class="shell">
    <div class="brand"><img src="../assets/logo-madyclear.svg" alt="MADYCLEAR"></div>
    <section class="card" id="loginCard">
      <div class="lock">🔐</div>
      <div class="eyebrow">MADYCLEAR Personal</div>
      <h1>Accès privé</h1>
      <p>Le cockpit interne est maintenant séparé du site client. Connecte-toi pour ouvrir ton espace de pilotage.</p>
      <div id="status" class="status">Vérification de la session…</div>
      <form id="loginForm" class="hidden">
        <div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div>
        <div class="field"><label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password" required></div>
        <button id="loginBtn" class="primary" type="submit">Ouvrir MADYCLEAR Personal</button>
      </form>
      <div id="altActions" class="row hidden">
        <button id="magicBtn" class="secondary" type="button">Recevoir un lien</button>
        <button id="clearBtn" class="secondary" type="button">Effacer la session</button>
      </div>
      <a class="link" href="/">← Retour au site MADYCLEAR</a>
      <div class="legal">Accès réservé aux comptes autorisés • données privées protégées par authentification Supabase.</div>
    </section>
  </div>
<script>
(()=>{
'use strict';
const SUPABASE_URL='https://trvmbwpwnpimrxrmvrgd.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_t5KTbJLqhvDuMnb_ZYva-w_dRLmsSZ5';
const PRIVATE_APP_URL=SUPABASE_URL+'/functions/v1/madyclear-app';
const AUTH_STORE='madyclear-supabase-auth-v1';
const $=id=>document.getElementById(id);
const publicHeaders=()=>({'apikey':PUBLISHABLE_KEY,'Content-Type':'application/json'});
const readAuth=()=>{try{return JSON.parse(localStorage.getItem(AUTH_STORE)||'null')}catch{return null}};
const writeAuth=s=>s?localStorage.setItem(AUTH_STORE,JSON.stringify(s)):localStorage.removeItem(AUTH_STORE);
const setStatus=(text,type='')=>{const el=$('status');el.textContent=text;el.className='status'+(type?' '+type:'')};
const showLogin=()=>{$('loginForm').classList.remove('hidden');$('altActions').classList.remove('hidden')};
const hideLogin=()=>{$('loginForm').classList.add('hidden');$('altActions').classList.add('hidden')};

async function retireOldWorker(){
  try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope.includes('/app/')).map(r=>r.unregister()))}}catch(e){}
  try{if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('madyclear-personal-')).map(k=>caches.delete(k)))}}catch(e){}
}
function normalizeSession(data,email=''){
  const expiresIn=Number(data.expires_in||3600);
  return {access_token:data.access_token,refresh_token:data.refresh_token,expires_at:Date.now()+expiresIn*1000,email:data.user?.email||email||'',user_id:data.user?.id||''};
}
async function authRequest(path,body){
  const r=await fetch(SUPABASE_URL+path,{method:'POST',headers:publicHeaders(),body:JSON.stringify(body)});
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(data?.msg||data?.message||data?.error_description||data?.error||`Authentification HTTP ${r.status}`);
  return data;
}
async function loginPassword(email,password){
  const data=await authRequest('/auth/v1/token?grant_type=password',{email,password});
  const session=normalizeSession(data,email);writeAuth(session);return session;
}
async function refreshSession(session){
  if(!session?.refresh_token)throw new Error('Connexion requise.');
  const data=await authRequest('/auth/v1/token?grant_type=refresh_token',{refresh_token:session.refresh_token});
  const fresh=normalizeSession(data,session.email||'');writeAuth(fresh);return fresh;
}
async function validSession(){
  let s=readAuth();if(!s?.access_token)return null;
  if(!s.expires_at||Number(s.expires_at)-Date.now()<60000){try{s=await refreshSession(s)}catch(e){writeAuth(null);return null}}
  return s;
}
function parseAuthCallback(){
  const hash=new URLSearchParams(location.hash.replace(/^#/,''));
  if(hash.get('access_token')&&hash.get('refresh_token')){
    const session={access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token'),expires_at:Date.now()+Number(hash.get('expires_in')||3600)*1000,email:'',user_id:''};
    writeAuth(session);history.replaceState(null,'',location.pathname+location.search);return session;
  }
  return null;
}
async function requestMagicLink(email){
  if(!email)throw new Error('Entre ton e-mail.');
  const r=await fetch(SUPABASE_URL+'/auth/v1/otp',{method:'POST',headers:publicHeaders(),body:JSON.stringify({email,create_user:false,redirect_to:'https://www.madyclear.fr/app/'})});
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(data?.msg||data?.message||data?.error_description||data?.error||`Lien impossible HTTP ${r.status}`);
}
async function loadPrivateApp(session,retry=true){
  hideLogin();setStatus('Ouverture du cockpit privé…','ok');
  const r=await fetch(PRIVATE_APP_URL,{method:'GET',headers:{'apikey':PUBLISHABLE_KEY,'Authorization':'Bearer '+session.access_token},cache:'no-store'});
  if(r.status===401&&retry&&session.refresh_token){const fresh=await refreshSession(session);return loadPrivateApp(fresh,false)}
  if(r.status===403)throw new Error('Ce compte n’est pas autorisé à ouvrir le cockpit MADYCLEAR.');
  if(!r.ok)throw new Error('Cockpit privé indisponible pour le moment (HTTP '+r.status+').');
  const html=await r.text();
  document.open();document.write(html);document.close();
}
async function bootstrap(){
  await retireOldWorker();
  const callback=parseAuthCallback();
  const session=callback||await validSession();
  if(session){try{return await loadPrivateApp(session)}catch(e){setStatus(String(e.message||e),'err');showLogin();return}}
  setStatus('Connexion requise.');showLogin();
}
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();const email=$('email').value.trim(),password=$('password').value;
  try{hideLogin();setStatus('Connexion sécurisée…');const s=await loginPassword(email,password);await loadPrivateApp(s)}catch(err){setStatus(String(err.message||err),'err');showLogin()}
});
$('magicBtn').addEventListener('click',async()=>{
  try{setStatus('Envoi du lien de connexion…');await requestMagicLink($('email').value.trim());setStatus('Lien envoyé. Vérifie ta boîte e-mail.','ok')}catch(err){setStatus(String(err.message||err),'err')}
});
$('clearBtn').addEventListener('click',()=>{writeAuth(null);setStatus('Session locale effacée.');showLogin()});
bootstrap();
})();
</script>
</body>
</html>
